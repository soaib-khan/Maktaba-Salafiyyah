<html lang="en">
<head>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- Premium Dark Theme Palette --- */
        :root {
            --bg-base: #070b0d; 
            --card-bg: rgba(18, 25, 30, 0.6); 
            --primary-glow: #10b981; 
            --secondary-glow: #047857; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* --- Live Animated Background (Glowing Orbs) --- */
        .live-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: var(--bg-base);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: float 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            top: -10%; left: -10%;
            width: 50vw; height: 50vw;
            background: rgba(16, 185, 129, 0.15); 
        }

        .orb-2 {
            bottom: -10%; right: -10%;
            width: 40vw; height: 40vw;
            background: rgba(4, 120, 87, 0.15); 
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10vw, 10vh) scale(1.2); }
        }

        /* --- Header --- */
        header {
            padding: 3rem 1rem 2rem;
            text-align: center;
            animation: dropDown 1s ease-out;
        }

        header h1 {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #fff, var(--primary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
        }

        header p {
            font-size: 1rem;
            font-weight: 300;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* --- Main Grid --- */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            min-height: 60vh;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
        }

        /* --- Glassmorphism Folder Card --- */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            transform: translateY(30px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-decoration: none;
            display: block;
        }

        .card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.15);
        }

        .card-img-container {
            width: 100%;
            height: 180px;
            overflow: hidden;
            position: relative;
        }

        .card-img-container::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(18, 25, 30, 0.9), transparent);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .card:hover .card-img {
            transform: scale(1.1) rotate(1deg);
        }

        .card-title {
            padding: 1.2rem;
            text-align: center;
            font-weight: 500;
            font-size: 1.05rem;
            color: var(--text-main);
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 70px;
        }
        
        .card:hover .card-title {
            color: var(--primary-glow);
        }

        /* --- Footer & Watermark --- */
        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        footer .watermark {
            color: var(--primary-glow);
            font-weight: 500;
            letter-spacing: 1px;
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
        }

        @keyframes dropDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

        const folderGrid = document.getElementById('folderGrid');

        // Folders render aur animate karne ka function
        function renderFolders() {
            appData.forEach((folder, index) => {
                const card = document.createElement('a'); 
                card.className = 'card';
                card.href = folder.link; 
                card.target = "_blank"; 

                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${folder.thumbnailUrl}" alt="${folder.folderName}" class="card-img">
                    </div>
                    <div class="card-title">
                        ${folder.folderName} 
                        <i class="fas fa-external-link-alt" style="font-size: 0.75rem; opacity: 0.6; margin-top:2px;"></i>
                    </div>
                `;
                folderGrid.appendChild(card);

                // Smooth staggered appearance effect
                setTimeout(() => {
                    card.classList.add('show');
                }, index * 100); // 100ms delay taaki jaldi aur smooth list load ho
            });
        }

        // App start on window load
        window.onload = renderFolders;
